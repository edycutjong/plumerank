name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege by default: every job reads the repo and nothing else. A job that needs
# more asks for it itself. Third-party actions are pinned to commit SHAs (tag in the
# trailing comment) so a moved tag cannot change what runs here; Dependabot's
# github-actions ecosystem keeps the SHAs current.
permissions:
  contents: read

jobs:
  # ── STAGE 1: Backend Quality (Python) ─────────────────────
  backend-quality:
    name: "Stage 1 · Backend Quality (Python)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install (full runtime lock + dev lock, then the package without re-resolving)
        run: |
          pip install -r requirements-dev.lock
          pip install --no-deps -e .
      - name: Lint (ruff)
        run: ruff check --output-format=github .
      - name: Typecheck (mypy)
        run: mypy plumerank api --ignore-missing-imports
      - name: Offline suite + coverage (same command as `make test`)
        run: pytest tests -m "not live" --cov=plumerank --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: coverage.xml
          retention-days: 7
          if-no-files-found: ignore

  # ── STAGE 1: Frontend Quality (Next.js, web/) ─────────────
  frontend-quality:
    name: "Stage 1 · Frontend Quality (web/)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Type check
        run: npm run typecheck

  # ── STAGE 2: Security Gate (parallel with Stage 1) ────────
  secret-scan:
    name: "Stage 2 · Secret Scanning"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full history for scanning git commits
      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@b2b0a92070f206ab7b5a1105d82a7f2f48d92341 # v3.99.0
        with:
          # Lob is excluded: its detector reads long snake_case test names
          # (test_baseline_reset_forgets_every_camera) as Lob keys and Lob's API "verifies"
          # them -- 12 false positives that fail the scan on a clean checkout.
          extra_args: --only-verified --exclude-detectors=Lob

  dependency-audit:
    name: "Stage 2 · Dependency Audit"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: pip-audit (full runtime lock -- every transitive, not just the top level)
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.lock
        continue-on-error: true # advisory — don't block on unpatched upstream transitive CVEs
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: npm audit (high + critical)
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=high
        continue-on-error: true # Don't block on transitive dep issues

  # ── STAGE 3: Build Verification ───────────────────────────
  build:
    name: "Stage 3 · Build Verification (web/)"
    needs: [frontend-quality]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Next.js production build
        run: npm run build
        env:
          # No live backend in this job — build-time inlining only, exercised for real
          # (with a running API) in the Stage 4 E2E job below.
          NEXT_PUBLIC_PLUMERANK_API: ""

  # ── STAGE 4: E2E Tests — against the REAL FastAPI backend ─
  # The backend needs no credentials and no network (api/main.py reads AWS instance
  # metadata only when actually running on EC2, and degrades honestly to
  # `live_pipeline.available: false` otherwise — see api/main.py:_probe_reason). So
  # "demo mode" here is not a mock: it is the same backend process, genuinely run,
  # genuinely reporting that no calibrated threshold exists yet. That is the real
  # zero-flag state of this repo today, and the E2E suite asserts the UI represents
  # it honestly rather than faking a ranking.
  e2e:
    name: "Stage 4 · E2E Tests"
    needs: [build, backend-quality]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install backend
        run: |
          pip install -r requirements-dev.lock
          pip install --no-deps -e .
      - name: Start the real API in the background
        run: |
          nohup uvicorn api.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health > /dev/null && exit 0
            sleep 1
          done
          echo "API did not become healthy in time"; cat /tmp/api.log; exit 1
      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Build against the live local API
        working-directory: web
        run: npm run build
        env:
          NEXT_PUBLIC_PLUMERANK_API: "http://127.0.0.1:8000"
      - name: Run E2E tests
        working-directory: web
        run: npx playwright test
        env:
          NODE_ENV: production
      - name: API log (always, for debugging)
        if: always()
        run: cat /tmp/api.log || true
      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  # ── STAGE 5: Performance (web/) ───────────────────────────
  performance:
    name: "Stage 5 · Performance"
    needs: [build]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_PLUMERANK_API: ""
      # The static export is served here, by a pinned `serve`, and polled until it answers,
      # instead of letting lhci start `npm run start` and wait for lighthouserc.json's
      # "Ready in" -- a Next.js dev-server string that `serve` never prints, so the step
      # used to hang until lhci's timeout. lhci then collects against the running server.
      - name: Serve the static export
        run: |
          nohup npx --yes serve@14.2.6 out -l 3000 > /tmp/serve.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ > /dev/null && exit 0
            sleep 1
          done
          echo "static export did not answer on :3000"; cat /tmp/serve.log; exit 1
      # The project's own pinned @lhci/cli (web/package-lock.json), not a second global
      # version; reports stay in the run as an artifact, never on public temporary storage
      # (web/lighthouserc.json's upload target is overridden here for CI).
      - name: Lighthouse CI
        run: |
          npx --no-install lhci autorun --collect.startServerCommand="" \
            --upload.target=filesystem --upload.outputDir=lhci-report
        continue-on-error: true # Advisory — don't block deploys on perf regressions yet
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-report
          path: web/lhci-report
          if-no-files-found: ignore
        continue-on-error: true # Advisory — don't block deploys on perf regressions yet

  # ── STAGE 6: Deploy Gate (main only) ──────────────────────
  deploy-gate:
    name: "Stage 6 · Deploy Gate"
    needs: [build, e2e, performance, secret-scan, dependency-audit, backend-quality]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: All gates passed
        run: |
          echo "All CI/CD gates passed"
          echo ""
          echo "Pipeline Summary:"
          echo "  - Stage 1 - Backend Quality (ruff, mypy, pytest --cov, 97% on plumerank/)"
          echo "  - Stage 1 - Frontend Quality (eslint, tsc)"
          echo "  - Stage 2 - Secret Scanning (TruffleHog) + full-history gitleaks (separate workflow)"
          echo "  - Stage 2 - Dependency Audit (pip-audit + npm audit)"
          echo "  - Stage 3 - Build Verification (Next.js)"
          echo "  - Stage 4 - E2E Tests against the real FastAPI backend (Playwright)"
          echo "  - Stage 5 - Performance (Lighthouse CI)"
