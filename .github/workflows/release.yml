name: release

# After CI, never beside it: a push used to be tagged while its own CI run was still red.
# workflow_run fires when "CI/CD Pipeline" finishes on main; the job runs only if it passed.
on:
  workflow_run:
    workflows: [ "CI/CD Pipeline" ]
    types: [ completed ]
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    # Only a successful CI run triggered by a PUSH to this repository's main. A pull
    # request from a fork whose branch happens to be named "main" also completes "CI/CD
    # Pipeline" on branch main, and must never be tagged.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write    # required to push the tag and create the Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0        # full history — we read commits since the last tag
          # The commit CI actually tested, not whatever main points at by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Compute next version from Angular commits
        id: ver
        run: |
          set -euo pipefail
          LAST=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          # The FIRST release is a decision, not a side effect of a push: with no tag yet,
          # every commit in the history would count as "since the last release", so the
          # first push to main would cut a release out of the whole build log. Cut v0.x
          # deliberately from the Actions tab (workflow_dispatch); after that, pushes
          # release automatically from the commits since that tag.
          if [ -z "$LAST" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "No release tag yet -- the first release is cut by hand (workflow_dispatch)."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$LAST" ]; then
            RANGE=""; CUR="0.0.0"
          else
            RANGE="${LAST}..HEAD"; CUR="${LAST#v}"
          fi
          LOG=$(git log --format=%B $RANGE)
          if [ -z "$(echo "$LOG" | tr -d '[:space:]')" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          BUMP=none
          echo "$LOG" | grep -qE '^(feat|fix|perf)(\(.+\))?!:|BREAKING CHANGE:' && BUMP=major
          [ "$BUMP" = none ] && echo "$LOG" | grep -qE '^feat(\(.+\))?:'        && BUMP=minor
          [ "$BUMP" = none ] && echo "$LOG" | grep -qE '^(fix|perf)(\(.+\))?:'  && BUMP=patch
          if [ "$BUMP" = none ]; then
            echo "No releasable commits since ${LAST:-the beginning}."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          IFS=. read -r MA MI PA <<< "$CUR"
          case "$BUMP" in
            major) MA=$((MA+1)); MI=0; PA=0 ;;
            minor) MI=$((MI+1)); PA=0 ;;
            patch) PA=$((PA+1)) ;;
          esac
          NEXT="v${MA}.${MI}.${PA}"
          echo "Bump: $BUMP  ${LAST:-none} -> $NEXT"
          echo "next=$NEXT"  >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP"  >> "$GITHUB_OUTPUT"
          echo "skip=false"  >> "$GITHUB_OUTPUT"

      - name: Tag and publish the release
        if: steps.ver.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.ver.outputs.next }}" -m "${{ steps.ver.outputs.next }}"
          git push origin "${{ steps.ver.outputs.next }}"
          gh release create "${{ steps.ver.outputs.next }}" \
            --generate-notes --title "${{ steps.ver.outputs.next }}"
