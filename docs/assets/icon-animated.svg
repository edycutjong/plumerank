<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="PlumeRank — ranks wildfire-camera tiles by how far each has moved from its own recent baseline, at a fixed budget of 2 alerts per camera-window: Tile 17 jumps from thirtieth to first on the watch list, and one of its two budget slots fills.">
<!-- STORYBOARD (dur 6s — must equal this file's single master dur)
  0-10%   steady state: plate, azimuth ring, the camera's view of a ridge at night, both budget slots empty; a scanning bearing sweeps the ring (poster rule: all brand layers at opacity 1)
  10-30%  trigger:      an ember appears on the ridge and a plume rises from it, soft at the crown, hard at the foot     data-story="beat-2"
  30-60%  mechanism:    Tile 17 jumps from thirtieth to first on the watch list, and one of its two budget slots fills.     data-story="beat-3"
                        (the sweep stops on the plume's bearing, the bearing tick lights ember, the left slot fills amber)
  60-88%  resolution:   held — the bearing stays lit and the slot stays spent (a spent slot is gone for the camera-window); glow breath    data-story="beat-4"
  88-100% breathe + seam fade: the story layer fades out 88-92%, the sweep resets unseen and returns 93-98.5%
-->
<style>
  .pop{transform-box:fill-box;transform-origin:center;animation:pop 6s cubic-bezier(.2,1.4,.4,1) infinite}
  @keyframes pop{0%,38%{transform:scale(.2)}42%{transform:scale(1.22)}46%,100%{transform:scale(1)}}
  .breath{transform-box:fill-box;transform-origin:center;animation:breath 6s ease-in-out infinite}
  @keyframes breath{0%,55%{transform:scale(1)}72%{transform:scale(1.18)}88%,100%{transform:scale(1)}}
  @media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<defs><radialGradient id="asky" cx="50%" cy="78%" r="70%"><stop offset="0" stop-color="#2A3442"/><stop offset=".55" stop-color="#24323F"/><stop offset="1" stop-color="#121B26"/></radialGradient><linearGradient id="asmk" gradientUnits="userSpaceOnUse" x1="0" y1="278" x2="0" y2="84"><stop offset="0" stop-color="#FFC9A8"/><stop offset=".14" stop-color="#EEF0F4" stop-opacity=".96"/><stop offset=".5" stop-color="#C9CEDA" stop-opacity=".86"/><stop offset=".82" stop-color="#AEB7C6" stop-opacity=".4"/><stop offset="1" stop-color="#9AA5B6" stop-opacity="0"/></linearGradient><radialGradient id="aemb" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FF6B4A" stop-opacity=".75"/><stop offset=".45" stop-color="#FF6B4A" stop-opacity=".22"/><stop offset="1" stop-color="#FF6B4A" stop-opacity="0"/></radialGradient><clipPath id="aview"><circle cx="256" cy="252" r="166"/></clipPath><filter id="asoft" x="-30%" y="-20%" width="160%" height="150%"><feTurbulence type="fractalNoise" baseFrequency=".022" numOctaves="3" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="18" xChannelSelector="R" yChannelSelector="G" result="d"/><feGaussianBlur in="d" stdDeviation="5"/></filter>
<linearGradient id="feather" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000"/><stop offset=".28" stop-color="#fff"/></linearGradient>
<mask id="arise" maskUnits="userSpaceOnUse" x="40" y="20" width="432" height="300"><rect x="40" width="432" height="300" y="282" fill="url(#feather)"><animate attributeName="y" values="282;282;-20;-20;282;282" keyTimes="0;0.11;0.31;0.9;0.92;1" dur="6s" repeatCount="indefinite"/></rect></mask>
