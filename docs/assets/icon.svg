<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t d">
<title id="t">PlumeRank</title>
<desc id="d">PlumeRank — ranks wildfire-camera tiles by how far each has moved from its own recent baseline, at a fixed budget of 2 alerts per camera-window: Tile 17 jumps from thirtieth to first on the watch list, and one of its two budget slots fills. Mark: a smoke plume welded to a ridge inside a fixed camera's view, an azimuth ring with one bearing lit, and two budget slots with one spent.</desc>
