[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plumerank"
version = "0.1.0"
description = "Ranks which wildfire-camera tiles a dispatcher should look at next, at a fixed budget of 2 alerts per camera-night."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "opencv-contrib-python-headless==5.0.0.93",
  "numpy==2.1.3",
  "fastapi==0.142.2",
  "uvicorn[standard]==0.32.1",
  "pydantic==2.9.2",
  "boto3==1.35.76",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "pytest-cov==5.0.0",
  "httpx==0.28.1",
  "hypothesis==6.168.3",
  "ruff==0.16.10",
  "mypy==2.4.0",
  "pip-audit==2.10.1",
]

[tool.setuptools]
packages = ["plumerank", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "live: hits a real external service (AWS or the deployed endpoint); excluded from `make test`",
]

[tool.coverage.run]
source = ["plumerank"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Pinned explicitly so CI behaviour does not depend on whatever ruff ships as its
# own default in a given version: pyflakes + pycodestyle + import sorting only.
# This is a numerically sensitive, already-tested pipeline (680+ tests, 97% coverage
# on plumerank/) getting lint for the first time -- opinionated style rules
# (blind-except, datetime-tz, pylint-refactor) are not applied retroactively under
# deadline pressure on code this project did not write with them in mind.
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
